---
# Single source of truth: KVM hosts and every VM on them.
# Group names follow your existing playbooks (k8s_cluster, kube_control_plane)
# so those plays keep working against this inventory.
#
# Each VM has two NICs:
#   enp1s0 on br0: ansible_host (10.71.251.x), management, default route, API VIP
#   enp2s0 on br1: k8s_ip (10.73.5.x), node traffic (kubelet, etcd, Calico)
# kvm_host says which KVM server the VM is created on.
# IPs follow the kub1 pattern (.13-.20) as PLACEHOLDERS: change them if kub1 still uses them.
all:
  children:
    kvm_hosts:
      hosts:
        uxus1kub2ctl01p:
          ansible_host: 10.192.159.5               # uxus1kub2ctl01p.unitedlex.global
        uxus1kub2ctl02p:
          ansible_host: 10.192.159.6               # uxus1kub2ctl02p.unitedlex.global

    k8s_cluster:
      children:
        kube_control_plane:
          hosts:
            uxus1kub2ctr001: {ansible_host: 10.71.251.13, k8s_ip: 10.73.5.13, kvm_host: uxus1kub2ctl01p}
            uxus1kub2ctr002: {ansible_host: 10.71.251.14, k8s_ip: 10.73.5.14, kvm_host: uxus1kub2ctl02p}
            uxus1kub2ctr003: {ansible_host: 10.71.251.15, k8s_ip: 10.73.5.15, kvm_host: uxus1kub2ctl01p}
        kube_node:
          # Longhorn passthrough disks: add vm_disks per worker, e.g.
          #   vm_disks: [{device: /dev/disk/by-id/dm-uuid-mpath-<wwid>, interndisk: /dev/vdb, mount: /var/lib/longhorn}]
          hosts:
            uxus1kub2wrk001: {ansible_host: 10.71.251.16, k8s_ip: 10.73.5.16, kvm_host: uxus1kub2ctl01p}
            uxus1kub2wrk002: {ansible_host: 10.71.251.17, k8s_ip: 10.73.5.17, kvm_host: uxus1kub2ctl02p}
            uxus1kub2wrk003: {ansible_host: 10.71.251.18, k8s_ip: 10.73.5.18, kvm_host: uxus1kub2ctl01p}
            uxus1kub2wrk004: {ansible_host: 10.71.251.19, k8s_ip: 10.73.5.19, kvm_host: uxus1kub2ctl02p}
            uxus1kub2wrk005: {ansible_host: 10.71.251.20, k8s_ip: 10.73.5.20, kvm_host: uxus1kub2ctl01p}
