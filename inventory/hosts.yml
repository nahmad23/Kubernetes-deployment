---
# Single source of truth: KVM hosts and every VM on them.
# Group names follow your existing playbooks (k8s_cluster, kube_control_plane)
# so those plays keep working against this inventory.
#
# Each VM has two NICs:
#   enp1s0 on br0: ansible_host (10.71.251.x), management, default route, API VIP
#   enp2s0 on br1: k8s_ip (10.73.5.x), node traffic (kubelet, etcd, Calico)
# kvm_host says which KVM server the VM is created on.
all:
  children:
    kvm_hosts:
      hosts:
        uxus1kub1ctl01p:
        uxus1kub1ctl02p:

    k8s_cluster:
      children:
        kube_control_plane:
          hosts:
            uxus1kub1ctr001: {ansible_host: 10.71.251.13, k8s_ip: 10.73.5.13, kvm_host: uxus1kub1ctl01p}
            uxus1kub1ctr002: {ansible_host: 10.71.251.14, k8s_ip: 10.73.5.14, kvm_host: uxus1kub1ctl02p}
            uxus1kub1ctr003: {ansible_host: 10.71.251.15, k8s_ip: 10.73.5.15, kvm_host: uxus1kub1ctl01p}
        kube_node:
          hosts:
            uxus1kub1npl001:
              ansible_host: 10.71.251.16
              k8s_ip: 10.73.5.16
              kvm_host: uxus1kub1ctl01p
              vm_disks:
                - {device: /dev/disk/by-id/dm-uuid-mpath-3600a09803830476f483f4e4c36483368, interndisk: /dev/vdb, mount: /var/lib/longhorn}
            uxus1kub1npl002:
              ansible_host: 10.71.251.17
              k8s_ip: 10.73.5.17
              kvm_host: uxus1kub1ctl02p
              vm_disks:
                - {device: /dev/disk/by-id/dm-uuid-mpath-3600a09803830476f483f4e4c3648336a, interndisk: /dev/vdb, mount: /var/lib/longhorn}
            uxus1kub1npl003:
              ansible_host: 10.71.251.18
              k8s_ip: 10.73.5.18
              kvm_host: uxus1kub1ctl02p
              vm_disks:
                - {device: /dev/disk/by-id/dm-uuid-mpath-3600a09803830476f483f4e4c36483370, interndisk: /dev/vdb, mount: /var/lib/longhorn}
            uxus1kub1npl004: {ansible_host: 10.71.251.19, k8s_ip: 10.73.5.19, kvm_host: uxus1kub1ctl02p}
            uxus1kub1npl005: {ansible_host: 10.71.251.20, k8s_ip: 10.73.5.20, kvm_host: uxus1kub1ctl01p}
            uxus1kub1npl006: {ansible_host: 10.71.251.21, k8s_ip: 10.73.5.21, kvm_host: uxus1kub1ctl01p}
