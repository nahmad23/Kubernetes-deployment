---
# Your existing SSH / user / limits plays, with fixes:
# - sudoers rule goes to /etc/sudoers.d and sshd_config is validated before use
# - sshd only restarts when its config changed
- name: Create the ansible user and harden SSH
  hosts: k8s_cluster
  gather_facts: false
  become: true
  vars:
    ansible_user: ubuntu                 # first login uses the cloud-init user
    ansible_controller_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID5DKvFz+6xdwHogr+6rZYT59+1u1FZLMXjgFk3VB54Z ansible-controller"
  handlers:
    - name: Restart ssh
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted
  tasks:
    - name: Add SSH authorized keys for ubuntu
      ansible.posix.authorized_key:
        user: ubuntu
        key: "{{ item }}"
      loop: "{{ ulx_ssh_authorized_keys }}"

    - name: Ensure ansible user exists
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash

    - name: Authorise the controller key for ansible
      ansible.posix.authorized_key:
        user: ansible
        key: "{{ ansible_controller_key }}"

    - name: Passwordless sudo for ansible
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-ansible
        content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Install sshd_config
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
        content: |
          # This is the sshd server system-wide configuration file.  See
          # sshd_config(5) for more information.
          Include /etc/ssh/sshd_config.d/*.conf
          MACs hmac-sha1,hmac-sha2-256,hmac-sha2-512
          KexAlgorithms ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256
          Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
          LogLevel INFO
          PermitRootLogin no
          MaxAuthTries 4
          PubkeyAuthentication yes
          UsePAM yes
          X11Forwarding yes
          PermitEmptyPasswords no
          KbdInteractiveAuthentication no
          GSSAPIAuthentication no
          ClientAliveInterval 300
          ClientAliveCountMax 3
          DisableForwarding yes
      notify: Restart ssh

- name: Tune fsnotify and file descriptor limits for Kubernetes workloads
  hosts: k8s_cluster
  gather_facts: false
  become: true
  tasks:
    - name: Raise kernel fsnotify and file descriptor limits
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/90-k8s-limits.conf
        reload: true
      loop:
        - {name: fs.inotify.max_user_instances, value: "8192"}
        - {name: fs.inotify.max_user_watches, value: "1048576"}
        - {name: fs.inotify.max_queued_events, value: "65536"}
        - {name: fs.file-max, value: "2097152"}

    - name: Persist nofile limits
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-k8s-nofile.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          * soft nofile 1048576
          * hard nofile 1048576
          root soft nofile 1048576
          root hard nofile 1048576
