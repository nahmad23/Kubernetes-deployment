---
- name: Check whether this control plane already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Join as a control plane
  when: not admin_conf.stat.exists
  block:
    - name: Re-upload control-plane certs and get a certificate key
      ansible.builtin.shell: >-
        set -o pipefail &&
        kubeadm init phase upload-certs --upload-certs | tail -1
      args:
        executable: /bin/bash
      delegate_to: "{{ k8s_first_control_plane }}"
      register: cert_key
      changed_when: true

    - name: Create a short-lived join command
      ansible.builtin.command: kubeadm token create --ttl 30m --print-join-command
      delegate_to: "{{ k8s_first_control_plane }}"
      register: join_cmd
      changed_when: true

    - name: Join the control plane
      ansible.builtin.command: >-
        {{ join_cmd.stdout }} --control-plane
        --certificate-key {{ cert_key.stdout }}
        --apiserver-advertise-address {{ k8s_ip }}
      args:
        creates: /etc/kubernetes/admin.conf
