---
- name: Read the installed kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_version
  changed_when: false

- name: Write kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"

- name: Initialise the control plane
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs
  args:
    creates: /etc/kubernetes/admin.conf

- name: Fetch admin kubeconfig to the control node
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ k8s_admin_kubeconfig_local }}"
    flat: true
